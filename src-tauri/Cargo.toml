[package]
name = "usage-tracker"
version = "0.1.0"
description = "Local dashboard for Claude, ChatGPT, and Grok subscription usage"
authors = ["Usage Tracker"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "2", features = ["json"] }
which = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
